[package]
name = "codex-file-search-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex-file-search"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-component-api = { workspace = true }
codex-component-host = { workspace = true }
codex-file-search = { workspace = true }
codex-file-search-api = { workspace = true }
codex-file-search-component = { workspace = true }
codex-utils-home-dir = { workspace = true }
futures = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[package]
edition.workspace = true
license.workspace = true
name = "codex-thread-store-local-plugin"
version.workspace = true

[lib]
name = "codex_thread_store_local_plugin"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-thread-store-local-plugin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-agent-message-board-extension = { workspace = true }
codex-component-host = { workspace = true }
codex-rollout = { workspace = true }
codex-state = { workspace = true }
codex-thread-store = { workspace = true }
codex-thread-store-component = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
codex-component-api = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

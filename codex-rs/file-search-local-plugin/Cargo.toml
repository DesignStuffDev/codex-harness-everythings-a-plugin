[package]
name = "codex-file-search-local-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_file_search_local_plugin"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-file-search-local-plugin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-file-search = { workspace = true }
codex-file-search-api = { workspace = true }
codex-file-search-component = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "time"] }

[dev-dependencies]
codex-component-host = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
libc = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
